[project]
name = "web-search-ingestion"
version = "0.1.0"
description = "Web search ingestion pipeline: Tavily search -> fetch -> parse -> clean -> chunk, ready for RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11.3",
    "pydantic-settings>=2.8.1",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.5",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
trafilatura = ["trafilatura>=1.9.0"]
docling = ["docling>=2.43.0"]
unstructured = ["unstructured>=0.16.0"]
databricks = [
    "databricks-vectorsearch==0.66",
    "databricks-sdk>=0.102",
]

[project.scripts]
web-ingest = "web_ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_ingestion"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "jupyter>=1.1.1",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
