# Databricks Asset Bundle CI/CD (GitHub Actions)
#
# Required repo secrets:
#   DATABRICKS_HOST         e.g. https://dbc-b576ddfe-9e99.cloud.databricks.com
#   DATABRICKS_CLIENT_ID    service principal application id
#   DATABRICKS_CLIENT_SECRET
#
# Bundle targets (databricks/databricks.yml) need real warehouse ids, and
# the deployed jobs read the Tavily key from the Databricks secret scope
# `web-ingest` (key `tavily_api_key`).
#
# Triggers:
#   push to main            -> lint/test/validate + deploy dev
#   pull_request to main    -> lint/test/validate only
#   workflow_dispatch       -> deploy the chosen target (dev/acc/prd),
#                              optionally trigger the ingestion job

name: Databricks Bundle Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Databricks bundle target to deploy
        type: choice
        options: [dev, acc, prd]
        default: dev
      run_pipeline_after_deploy:
        description: Trigger web-ingestion-pipeline after deploying (jobs read Tavily from Databricks secret scope)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src/web_ingestion/**"
      - "databricks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/web_ingestion/**"
      - "databricks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.event.inputs.target || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests, bundle validate
    runs-on: ubuntu-latest
    env:
      HAS_SP: ${{ secrets.DATABRICKS_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install package and dev dependencies
        run: uv sync --group dev

      #- name: Ruff
        #run: uv run ruff check src tests

      #- name: Pytest
        #run: uv run pytest -q

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.20.0
        with:
          version: 0.281.1

      - name: Auth debug
        if: env.HAS_SP == 'true'
        working-directory: databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
        run: |
          export DATABRICKS_HOST="$(printf '%s' "$DATABRICKS_HOST" | tr -d '[:space:]')"
          export DATABRICKS_CLIENT_ID="$(printf '%s' "$DATABRICKS_CLIENT_ID" | tr -d '[:space:]')"
          export DATABRICKS_CLIENT_SECRET="$(printf '%s' "$DATABRICKS_CLIENT_SECRET" | tr -d '[:space:]')"
          mkdir -p ~/.databricks
          cat > ~/.databrickscfg <<EOF
          [DEFAULT]
          host = ${DATABRICKS_HOST}
          client_id = ${DATABRICKS_CLIENT_ID}
          client_secret = ${DATABRICKS_CLIENT_SECRET}
          EOF
          databricks auth describe --profile DEFAULT

      - name: Bundle validate (dev)
        if: env.HAS_SP == 'true'
        working-directory: databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          export DATABRICKS_HOST="$(printf '%s' "$DATABRICKS_HOST" | tr -d '[:space:]')"
          export DATABRICKS_CLIENT_ID="$(printf '%s' "$DATABRICKS_CLIENT_ID" | tr -d '[:space:]')"
          export DATABRICKS_CLIENT_SECRET="$(printf '%s' "$DATABRICKS_CLIENT_SECRET" | tr -d '[:space:]')"
          mkdir -p ~/.databricks
          cat > ~/.databrickscfg <<EOF
          [DEFAULT]
          host = ${DATABRICKS_HOST}
          client_id = ${DATABRICKS_CLIENT_ID}
          client_secret = ${DATABRICKS_CLIENT_SECRET}
          EOF
          export BUNDLE_VAR_PROJECT_VERSION="$(python3 -c "import tomllib;print(tomllib.load(open('../pyproject.toml','rb'))['project']['version'])")"
          databricks bundle validate --target dev

  deploy:
    name: Deploy (${{ matrix.target }})
    needs: quality
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch')
    strategy:
      matrix:
        target: [dev, acc, prd]
        include:
          - target: dev
            should_run: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          - target: acc
            should_run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'acc' }}
          - target: prd
            should_run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prd' }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Skip if not selected
        if: matrix.should_run != 'true'
        run: |
          echo "Skipping ${{ matrix.target }} for this trigger"
          exit 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.20.0
        with:
          version: 0.281.1

      - name: Build and deploy bundle to ${{ matrix.target }}
        working-directory: databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          export DATABRICKS_HOST="$(printf '%s' "$DATABRICKS_HOST" | tr -d '[:space:]')"
          export DATABRICKS_CLIENT_ID="$(printf '%s' "$DATABRICKS_CLIENT_ID" | tr -d '[:space:]')"
          export DATABRICKS_CLIENT_SECRET="$(printf '%s' "$DATABRICKS_CLIENT_SECRET" | tr -d '[:space:]')"
          mkdir -p ~/.databricks
          cat > ~/.databrickscfg <<EOF
          [DEFAULT]
          host = ${DATABRICKS_HOST}
          client_id = ${DATABRICKS_CLIENT_ID}
          client_secret = ${DATABRICKS_CLIENT_SECRET}
          EOF
          export BUNDLE_VAR_PROJECT_VERSION="$(python3 -c "import tomllib;print(tomllib.load(open('../pyproject.toml','rb'))['project']['version'])")"
          databricks bundle deploy --target ${{ matrix.target }}

